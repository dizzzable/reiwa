name: Docker Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  # Required so the Trivy SARIF can be uploaded to GitHub code scanning.
  security-events: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read package version
        id: version
        run: echo "value=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(jq -r .version package.json)"
          test "$package_version" = "$tag_version" || {
            echo "Release tag v$tag_version does not match package version $package_version" >&2
            exit 1
          }

      - name: Lower-case repo name
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      # Single unified image: API + bot + worker + SPA (served by the API).
      - name: Build & push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Re-resolve `node:24-alpine` instead of reusing whatever digest the
          # runner last saw. Without it the OS-patch layer is keyed to a stale
          # base and the CVE fix above never re-runs.
          pull: true
          # Single-manifest image (no provenance index) so Trivy can scan
          # the pushed image by its digest below.
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            REIWA_VERSION=${{ github.ref_type == 'tag' && github.ref_name || '' }}
            REIWA_GIT_SHA=${{ github.sha }}
            REIWA_GIT_BRANCH=${{ github.ref_name }}
            SECURITY_REFRESH=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Without this step the reiwa image was never scanned at all: the
      # Security tab reported "no analysis found", so a HIGH shipping in
      # node_modules stayed invisible while the identically-built rezeis
      # image had five alerts open. Mirrors rezeis/.github/workflows/
      # docker-publish.yml — the two must be changed together.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          # Scan the exact pushed image by digest (always exists; avoids the
          # tag-mismatch that left no SARIF file).
          image-ref: ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}@${{ steps.build.outputs.digest }}
          severity: 'CRITICAL,HIGH'
          # Report-only: the image is already published before this step, so
          # failing here would not un-publish it. Findings are surfaced in the
          # repository Security tab via the SARIF upload below.
          exit-code: '0'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'
