# reiwa user app — Nginx reverse proxy (443-only, bring-your-own cert)
#
# Replace REPLACE_WITH_YOUR_DOMAIN with the app hostname.
# No ACME, no port 80. Provide your own certificate as fullchain.pem +
# privkey.key next to this file (mounted read-only into /etc/nginx/ssl):
#   ../gen-self-signed-cert.sh app.example.com .
# or drop in a Cloudflare Origin cert / your own issued cert.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── Upstream, resolved PER REQUEST and not at startup ───────────────────────
#
# Deliberately NOT `upstream reiwa_web { server reiwa:5000; }`. That form makes
# nginx resolve `reiwa` while it is starting, which costs two things:
#
#   1. The proxy cannot come up before the app. With no `reiwa` container yet,
#      nginx exits with `host not found in upstream "reiwa"` and refuses to
#      start at all — while this repo's own README tells you to bring the proxy
#      up BEFORE or WITH the reiwa stack.
#   2. The address is then cached for the life of the worker. Recreating the
#      `reiwa` container gives it a new internal IP, and nginx keeps proxying
#      to the dead one until somebody reloads it — every request 502s in the
#      meantime, with nothing in the app's logs to explain it.
#
# Docker's embedded DNS at 127.0.0.11 plus the hostname in a VARIABLE defers
# resolution to request time: nginx starts regardless of what exists, and
# re-reads the address every 10s. `ipv6=off` because the embedded resolver
# answers AAAA for names that have no IPv6 address, and nginx would try it
# first and stall.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    server_name REPLACE_WITH_YOUR_DOMAIN;

    listen 443 ssl reuseport;
    listen [::]:443 ssl reuseport;
    http2 on;

    # The API accepts guest support attachments as base64 JSON up to 16 MB
    # (express.json limit on /api/v1/support/guest/attachments). Nginx's 1 MB
    # default would 413 them at the edge before the app ever sees them.
    client_max_body_size 16m;

    # HSTS — one year. After one visit, browsers refuse plaintext HTTP to
    # this host until the max-age expires.
    #
    # `includeSubDomains` is a commitment, not just a hardening flag: it
    # pins HTTPS for EVERY name under this one. If this host ever shares an
    # apex with another (e.g. app.example.com and panel.example.com both
    # under example.com), the header served from either one applies to the
    # whole example.com tree — including subdomains that have no cert yet,
    # which then become unreachable in any browser that saw the header, for
    # a year. If your DNS layout makes that risky, drop `includeSubDomains`;
    # the max-age alone still protects this host.
    #
    # `always` is required so the header is also sent on error responses
    # (4xx/5xx), not just 2xx/3xx.
    #
    # Inheritance trap: nginx/angie `add_header` is NOT inherited into a
    # `location` that declares its own `add_header` — it replaces the whole
    # inherited set. If you ever add an `add_header` to the `location /`
    # below (or any new location), you MUST repeat this line there or HSTS
    # silently vanishes for that path. As of this file, no location sets
    # any add_header, so the server-level directive covers everything.
    #
    # Deliberately NOT `preload`. Preload is a one-way submission to browser
    # vendors — removal takes months and rides browser release trains. Add
    # it only as a separate, conscious decision.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # -----------------------------------------------------------------
    # Real client IP — not needed today, REQUIRED if you ever put a CDN
    # (Cloudflare) in front of this VPS.
    #
    # Today this box terminates TLS directly, so $remote_addr is the real
    # client and the X-Forwarded-For set below is correct.
    #
    # Put Cloudflare (or any proxy/CDN) in front without enabling the
    # directives below and every request arrives from an edge address. The
    # app then treats that edge as the client, and:
    #   - the cabinet bans an offending IP for 24 HOURS — one abuser
    #     behind a given Cloudflare datacentre locks out every legitimate
    #     user routed through it, for a day;
    #   - the rezeis panel auto-blocks for 30 MINUTES on repeated failed
    #     logins — same blast radius, shorter fuse.
    # Rate limiting, abuse heuristics and audit logs all become wrong in
    # the same way, and the damage is invisible until users complain.
    #
    # To enable: fetch the CURRENT ranges from Cloudflare's published list
    # at https://www.cloudflare.com/ips/ (IPv4 and IPv6 — they change over
    # time) and write one `set_real_ip_from` per CIDR. Never substitute
    # 0.0.0.0/0: that trusts every peer and lets any client forge its own
    # address.
    #
    # set_real_ip_from <cloudflare-cidr>;   # one line per CIDR, IPv4 + IPv6
    # real_ip_header CF-Connecting-IP;
    #
    # The other stacks in this folder need their own equivalent:
    #   caddy   — `servers { trusted_proxies static <ranges> }`
    #   traefik — `entryPoints.https.forwardedHeaders.trustedIPs`
    # Traefik is the worst of the four here: when the peer is NOT trusted
    # it STRIPS every X-Forwarded-* header instead of shifting/appending,
    # so the client address is destroyed outright rather than merely wrong.
    # -----------------------------------------------------------------

    location / {
        proxy_http_version 1.1;
        # Hostname in a variable — see the resolver note at the top. With no URI
        # part after the variable, nginx passes the original request URI as-is.
        set $reiwa_upstream reiwa:5000;
        proxy_pass http://$reiwa_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # SSE (/api/v1/realtime/stream) + websocket keep-alive.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # SSL Configuration (Mozilla Intermediate Guidelines)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;
    ssl_certificate "/etc/nginx/ssl/fullchain.pem";
    ssl_certificate_key "/etc/nginx/ssl/privkey.key";

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;
}

# Stealth default server: reject TLS handshakes with a non-matching SNI so
# the app hostname isn't discoverable by scanning the IP.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_reject_handshake on;
}
