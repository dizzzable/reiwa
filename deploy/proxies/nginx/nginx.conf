# reiwa user app — Nginx reverse proxy (443-only, bring-your-own cert)
#
# Replace REPLACE_WITH_YOUR_DOMAIN with the app hostname.
# No ACME, no port 80. Provide your own certificate as fullchain.pem +
# privkey.key next to this file (mounted read-only into /etc/nginx/ssl):
#   ../gen-self-signed-cert.sh app.example.com .
# or drop in a Cloudflare Origin cert / your own issued cert.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ┌──────────────────────────────────────────────────────────────────────────┐
# │  UPSTREAM PORT IS HARD-CODED — THE 5000 BELOW IS NOT READ FROM .env      │
# └──────────────────────────────────────────────────────────────────────────┘
#
# The cabinet's docker-compose.yml publishes `${REIWA_PORT:-5000}` and the app
# listens on `PORT ?? REIWA_PORT`, so the port IS a variable there. Here it is
# a literal, and the proxy stacks in this folder load no .env at all.
#
# Change REIWA_PORT in the cabinet's .env and this file still dials 5000. The
# port is closed, so every request dies at the edge with a 502; the app logs
# NOTHING, because no request ever reaches it; and `docker compose ps` reports
# both containers healthy. Nothing in either log points at the cause.
#
# This is deliberately NOT solved with an environment variable: this project
# keeps its settings in the panel and adds nothing to .env. If you change the
# port, change it BY HAND here — in BOTH `set $reiwa_upstream` lines below —
# and in every other file listed under "Upstream port" in ../README.md.

# ── Upstream, resolved PER REQUEST and not at startup ───────────────────────
#
# Deliberately NOT `upstream reiwa_web { server reiwa:5000; }`. That form makes
# nginx resolve `reiwa` while it is starting, which costs two things:
#
#   1. The proxy cannot come up before the app. With no `reiwa` container yet,
#      nginx exits with `host not found in upstream "reiwa"` and refuses to
#      start at all — while this repo's own README tells you to bring the proxy
#      up BEFORE or WITH the reiwa stack.
#   2. The address is then cached for the life of the worker. Recreating the
#      `reiwa` container gives it a new internal IP, and nginx keeps proxying
#      to the dead one until somebody reloads it — every request 502s in the
#      meantime, with nothing in the app's logs to explain it.
#
# Docker's embedded DNS at 127.0.0.11 plus the hostname in a VARIABLE defers
# resolution to request time: nginx starts regardless of what exists, and
# re-reads the address every 10s. `ipv6=off` because the embedded resolver
# answers AAAA for names that have no IPv6 address, and nginx would try it
# first and stall.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    server_name REPLACE_WITH_YOUR_DOMAIN;

    listen 443 ssl reuseport;
    listen [::]:443 ssl reuseport;
    http2 on;

    # The API accepts guest support attachments as base64 JSON up to 16 MB
    # (express.json limit on /api/v1/support/guest/attachments). Nginx's 1 MB
    # default would 413 them at the edge before the app ever sees them.
    client_max_body_size 16m;

    # HSTS — one year. After one visit, browsers refuse plaintext HTTP to
    # this host until the max-age expires.
    #
    # `includeSubDomains` is a commitment, not just a hardening flag: it
    # pins HTTPS for EVERY name under this one. If this host ever shares an
    # apex with another (e.g. app.example.com and panel.example.com both
    # under example.com), the header served from either one applies to the
    # whole example.com tree — including subdomains that have no cert yet,
    # which then become unreachable in any browser that saw the header, for
    # a year. If your DNS layout makes that risky, drop `includeSubDomains`;
    # the max-age alone still protects this host.
    #
    # `always` is required so the header is also sent on error responses
    # (4xx/5xx), not just 2xx/3xx.
    #
    # Inheritance trap: nginx/angie `add_header` is NOT inherited into a
    # `location` that declares its own `add_header` — it replaces the whole
    # inherited set. If you ever add an `add_header` to the `location /`
    # below (or any new location), you MUST repeat this line there or HSTS
    # silently vanishes for that path. As of this file, no location sets
    # any add_header, so the server-level directive covers everything.
    #
    # Deliberately NOT `preload`. Preload is a one-way submission to browser
    # vendors — removal takes months and rides browser release trains. Add
    # it only as a separate, conscious decision.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # -----------------------------------------------------------------
    # Real client IP — not needed today, REQUIRED if you ever put a CDN
    # (Cloudflare) in front of this VPS.
    #
    # Today this box terminates TLS directly, so $remote_addr is the real
    # client and the X-Forwarded-For set below is correct.
    #
    # Put Cloudflare (or any proxy/CDN) in front without enabling the
    # directives below and every request arrives from an edge address. The
    # app then treats that edge as the client, and:
    #   - the cabinet bans an offending IP for 24 HOURS — one abuser
    #     behind a given Cloudflare datacentre locks out every legitimate
    #     user routed through it, for a day;
    #   - the rezeis panel auto-blocks for 30 MINUTES on repeated failed
    #     logins — same blast radius, shorter fuse.
    # Rate limiting, abuse heuristics and audit logs all become wrong in
    # the same way, and the damage is invisible until users complain.
    #
    # To enable: fetch the CURRENT ranges from Cloudflare's published list
    # at https://www.cloudflare.com/ips/ (IPv4 and IPv6 — they change over
    # time) and write one `set_real_ip_from` per CIDR. Never substitute
    # 0.0.0.0/0: that trusts every peer and lets any client forge its own
    # address.
    #
    # set_real_ip_from <cloudflare-cidr>;   # one line per CIDR, IPv4 + IPv6
    # real_ip_header CF-Connecting-IP;
    #
    # The other stacks in this folder need their own equivalent:
    #   caddy   — `servers { trusted_proxies static <ranges> }`
    #   traefik — `entryPoints.https.forwardedHeaders.trustedIPs`
    # Traefik is the worst of the four here: when the peer is NOT trusted
    # it STRIPS every X-Forwarded-* header instead of shifting/appending,
    # so the client address is destroyed outright rather than merely wrong.
    # -----------------------------------------------------------------

    # Advertise the idle keep-alive window to API clients.
    #
    # nginx already holds an idle client connection for 75s -- that is its
    # default and this line does not change it. What was missing is the SECOND
    # parameter, which is the only thing that makes nginx emit a
    # `Keep-Alive: timeout=` response header.
    #
    # It matters because of who else talks to this vhost. The rezeis panel
    # posts every notification here with Node's global `fetch` (undici), and
    # undici keeps an idle socket for 4 SECONDS unless a server tells it it may
    # keep it longer. Panel -> cabinet notifications are sparse and bursty, so
    # with the panel on its own VPS nearly every one of them finds no reusable
    # socket and pays a fresh DNS + TCP + TLS handshake. On one host that cost
    # was invisible; across two it is on every notification.
    #
    # 60 is SHORTER than 75 on purpose. The advertised value must be below the
    # value the server actually enforces, so the client is always the side that
    # closes. Advertise a value >= the real timeout and you hand clients a
    # window in which nginx has already closed a socket they still believe is
    # good -- the classic keep-alive race, which surfaces on the panel as
    # sporadic ECONNRESET on requests that were fine seconds earlier.
    keepalive_timeout 75s 60s;

    # ── The ONE long-lived route ──────────────────────────────────────────
    #
    # `GET /api/v1/realtime/stream` is the only streaming endpoint this app
    # has (`text/event-stream`, held open for hours). There are no WebSockets
    # anywhere in the cabinet — grep for them and you will find none.
    #
    # These settings used to live on `location /`, i.e. on EVERYTHING. That is
    # the defect this block exists to undo: with `proxy_read_timeout 3600s` on
    # the catch-all, an upstream that stops answering does not produce a 504
    # for a WHOLE HOUR. The browser shows a spinning tab and the operator sees
    # "the cabinet is down" while nginx is patiently waiting, logging nothing.
    #
    # It matters most in the split-VPS layout this repo now supports: a
    # cabinet document calls the panel on ANOTHER HOST before its first byte,
    # so a panel outage turns every page load into a slow request. The edge
    # must cut those off quickly, not wait an hour.
    location = /api/v1/realtime/stream {
        proxy_http_version 1.1;
        # Hostname in a variable — see the resolver note at the top.
        set $reiwa_upstream reiwa:5000;
        proxy_pass http://$reiwa_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # A stream must reach the client as it is produced, never spooled.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_http_version 1.1;
        # Hostname in a variable — see the resolver note at the top.
        set $reiwa_upstream reiwa:5000;
        proxy_pass http://$reiwa_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Kept so a future WebSocket route still upgrades correctly. Nothing
        # in the app upgrades today; SSE above is plain HTTP.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Bounded waits for ordinary requests.
        #
        # connect: the app is a sibling container on this host's Docker
        # network. If it does not accept a connection in 5s it is not going
        # to — the default 60s only delays the error.
        #
        # read: 60s is the ceiling for producing a response. The SPA document
        # legitimately takes seconds when the panel is slow (it fetches the
        # landing and the public config before its first byte), so this is
        # generous — but it is FINITE, which the old 3600s was not.
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # BUFFERS SIZED FOR WHAT THIS APP ACTUALLY SERVES.
        #
        # Response buffering is ON here (nginx default) and must stay on: it
        # is the only thing stopping one slow client from pinning a Node
        # worker for the length of its download.
        #
        # But the DEFAULT buffers are 8 x 4k, and every asset this app ships
        # is bigger than that -- so nginx spooled all of them to
        # `/var/cache/nginx/proxy_temp`. Production on 2026-08-24 had nothing
        # else in its log: one `an upstream response is buffered to a
        # temporary file` per JS chunk, per stylesheet, per branding image,
        # per visitor. Every page load wrote a dozen files to the container
        # writable layer and deleted them again.
        #
        # 8 x 16k covers the common chunk in memory. `proxy_max_temp_file_size
        # 0` handles the rest: it means "memory only, then pass through at the
        # client's pace" -- the slow-client protection WITHOUT the disk. The
        # panel config has carried this line for a while; this one never got
        # it, which is why the two behaved differently under the same load.
        proxy_buffer_size 8k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        proxy_max_temp_file_size 0;
    }

    # SSL Configuration (Mozilla Intermediate Guidelines)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;
    ssl_certificate "/etc/nginx/ssl/fullchain.pem";
    ssl_certificate_key "/etc/nginx/ssl/privkey.key";

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;
}

# Stealth default server: reject TLS handshakes with a non-matching SNI so
# the app hostname isn't discoverable by scanning the IP.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_reject_handshake on;
}
