# ════════════════════════════════════════════════════════════════════════════
#  docker-compose.pin-panel.yml — закрепить адрес панели, минуя DNS
#
#  КОГДА ЭТО НУЖНО. Только если панель на другом VPS И резолвер у провайдера
#  ненадёжен. Раздельная установка сама по себе этого НЕ требует — она работает
#  через обычный DNS. Оверлей нужен, когда DNS падает: `getaddrinfo EAI_AGAIN`
#  кладёт все бизнес-операции разом, запросы висят до таймаута и отвечают 503, а
#  в логе панели при этом пусто — они до неё не дошли.
#
#  ⚠️  ЭТО ПРИБИТЫЙ АДРЕС, И ОН НЕ УСТАРЕВАЕТ САМ. Панель переехала, сменила IP
#      или оказалась за Cloudflare с плавающими адресами — кабинет будет молча
#      стучаться в мёртвый адрес. Это ХУЖЕ временного сбоя DNS, который проходит
#      сам. Заводите только при статическом IP и впишите смену адреса в порядок
#      переезда панели.
#
#  СНАЧАЛА РАССМОТРИТЕ ВАРИАНТ БЕЗ ЭТОГО ФАЙЛА: резолверы на уровне демона
#  Docker (на хосте кабинета, /etc/docker/daemon.json):
#
#      { "dns": ["1.1.1.1", "8.8.8.8"] }   →   systemctl restart docker
#
#  Встроенный резолвер Docker при этом остаётся и продолжает разрешать имена
#  сервисов, то есть одиночная установка не ломается; чинится DNS и к панели, и
#  к api.telegram.org; ничего не устаревает при переезде. Оверлей ниже — на
#  случай, когда и это не помогает.
#
#  ИСПОЛЬЗОВАНИЕ (из каталога reiwa):
#    1. Узнайте адрес панели:   dig +short <ваш REZEIS_HOST>
#    2. Впишите в .env:         REZEIS_HOST_IP=203.0.113.10
#    3. Поднимите со оверлеем:
#       docker compose -f docker-compose.yml -f docker-compose.pin-panel.yml up -d
#
#  Оверлей нужно указывать при КАЖДОМ `up` — забыли, и пин просто не применится.
# ════════════════════════════════════════════════════════════════════════════

services:
  # Оба сервиса, а не только API: бот ходит к панели сам (в том числе пересылает
  # платежи Stars), поэтому пин только у `reiwa` оставил бы бота падать на том
  # же DNS — и это уже деньги.
  #
  # Имя берётся из той же переменной, что и адрес панели в приложении, поэтому
  # разойтись им негде. Записанное вторым местом руками, оно однажды разойдётся
  # с REZEIS_HOST — и пин будет выглядеть настроенным, ничего не делая.
  #
  # Форма `:?` роняет `docker compose up` с этим текстом, если переменной нет.
  # Пустая подстановка дала бы запись вида `panel.example.com:` — контейнер бы
  # не поднялся, но уже без объяснения, чего не хватает.
  reiwa:
    extra_hosts:
      - "${REZEIS_HOST:?REZEIS_HOST не задан в .env}:${REZEIS_HOST_IP:?REZEIS_HOST_IP не задан в .env — узнайте адрес через dig +short $REZEIS_HOST}"

  reiwa-bot:
    extra_hosts:
      - "${REZEIS_HOST:?REZEIS_HOST не задан в .env}:${REZEIS_HOST_IP:?REZEIS_HOST_IP не задан в .env — узнайте адрес через dig +short $REZEIS_HOST}"
